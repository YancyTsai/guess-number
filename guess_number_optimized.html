<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1A2B 最佳化版</title><style>body{font-family:Arial;max-width:900px;margin:auto;padding:16px;background:#f4f4f4}.card{background:#fff;padding:16px;border-radius:12px;margin:12px 0}button{padding:8px 14px}input{padding:6px}</style></head><body><h1>1A2B 最佳化版</h1><div class=card><h2>玩家猜電腦</h2><input id=guess maxlength=4><button onclick=playerGuess()>猜</button><div id=result></div></div><div class=card><h2>電腦猜玩家 (Minimax)</h2><button onclick=startAI()>開始</button><div id=ai></div></div><script>function score(a,g){let A=0,B=0;for(let i=0;i<4;i++)if(a[i]===g[i])A++;for(let c of g)if(a.includes(c))B++;return [A,B-A]}function allNums(){let r=[],d='0123456789';for(let a of d)for(let b of d)for(let c of d)for(let e of d){let s=a+b+c+e;if(new Set(s).size===4)r.push(s)}return r}function rand(){let a=allNums();return a[Math.floor(Math.random()*a.length)]}let secret=rand();function playerGuess(){let g=document.getElementById('guess').value;if(g.length!==4)return;let r=score(secret,g);result.innerHTML+='<div>'+g+' → '+r[0]+'A'+r[1]+'B</div>';}let all=[],cands=[],current='';function startAI(){all=allNums();cands=[...all];nextGuess()}function bestGuess(){let best=null,bestWorst=1e9;for(let g of all){let m={};for(let a of cands){let s=score(a,g).join(',');m[s]=(m[s]||0)+1}let worst=Math.max(...Object.values(m));if(worst<bestWorst){bestWorst=worst;best=g}}return best}function nextGuess(){if(cands.length===1){ai.innerHTML='<h3>答案：'+cands[0]+'</h3>';return}current=bestGuess();ai.innerHTML='電腦猜：<b>'+current+'</b><br>剩餘可能：'+cands.length+'<br>A:<input id=a size=2> B:<input id=b size=2><button onclick=feedback()>送出</button>'}function feedback(){let A=+document.getElementById('a').value,B=+document.getElementById('b').value;if(A===4){ai.innerHTML+='<h3>答案確定！</h3>';return}cands=cands.filter(x=>{let r=score(x,current);return r[0]===A&&r[1]===B});nextGuess()}</script></body></html>
